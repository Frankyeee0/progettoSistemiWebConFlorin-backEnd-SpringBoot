<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            padding: 30px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #16a34a;
            padding-bottom: 15px;
        }

        .header h1 {
            color: #16a34a;
            font-size: 24px;
            margin: 0;
        }

        .content {
            margin-top: 20px;
            color: #333;
            font-size: 16px;
            line-height: 1.6;
        }

        .date {
            color: #667085;
            font-size: 13px;
            margin-top: 6px;
        }

        .details {
            margin: 20px 0;
            border-collapse: collapse;
            width: 100%;
        }

        .details td {
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            font-size: 14px;
        }

        .details td:first-child {
            font-weight: 600;
            color: #0f172a;
            width: 35%;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 30px;
        }

        .logo {
            width: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg" alt="UniHub Logo">
            <h1>{{title}}</h1>
        </div>
        <div class="content">
            <div class="date">Email inviata il {{dataInvio}}</div>
            <p>{{message}}</p>

            <table class="details">
                {{details}}
            </table>

            <p>A presto,<br><b>Il Team di UniHub</b></p>
        </div>

        <div class="footer">
            © 2026 UniHub – Tutti i diritti riservati<br>
            <a href="#" style="color:#999;text-decoration:none;">www.unihub.it</a>
        </div>
    </div>
</body>
</html>
